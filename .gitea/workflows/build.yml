name: Build & Deploy
run-name: Deploy ${{ gitea.sha }}

on:
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Docker CLI
        run: |
          apk add --no-cache docker-cli
          docker version

      - name: Build & Deploy
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-7)

          # 构建镜像
          docker build -t frpc-panel:latest -t frpc-panel:$SHORT_SHA .

          # 部署容器
          mkdir -p /data/frpc-panel
          docker stop frpc-panel 2>/dev/null || true
          docker rm frpc-panel 2>/dev/null || true
          docker run -d \
            --name frpc-panel \
            --restart always \
            -p 3001:3001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /data/frpc-panel:/app/data \
            frpc-panel:$SHORT_SHA

      - name: Verify deployment
        run: |
          sleep 3
          docker ps --filter name=frpc-panel --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
